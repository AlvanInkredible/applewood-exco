<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B3A2D">
<title>Applewood Estate 2 – EXCO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0d2018;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.ticker-wrap{height:30px;overflow:hidden;display:flex;align-items:center;background:#C9A84C;flex-shrink:0}
.ticker-track{display:flex;white-space:nowrap;animation:tick 45s linear infinite}
.ticker-item{color:#1B3A2D;font-size:12px;font-weight:700;padding:0 30px;letter-spacing:.3px}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.tabs{display:flex;background:#1B3A2D;border-bottom:2px solid #2E5E45;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:none;border-bottom:3px solid transparent;color:#6B9B80;font-size:11px;font-weight:700;padding:11px 15px;cursor:pointer;text-transform:uppercase;letter-spacing:.9px;margin-bottom:-2px;transition:color .2s}
.tab.on{color:#C9A84C;border-bottom-color:#C9A84C}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto}
.prog-bar{height:3px;background:#1a3020;flex-shrink:0}
.prog-fill{height:100%;background:linear-gradient(90deg,#C9A84C,#E8C86A);transition:width .6s ease;width:0%}
.car-sec{flex:1;display:flex;flex-direction:column;overflow:hidden}
.c-outer{flex:1;overflow:hidden;position:relative}
.c-track{display:flex;height:100%;will-change:transform;transition:transform .42s cubic-bezier(.4,0,.2,1)}
.c-slide{min-width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 12px;background:#1B3A2D}
.ring{width:164px;height:164px;border-radius:50%;border:3px solid #C9A84C;overflow:hidden;flex-shrink:0;background:#2E5E45;margin-bottom:18px;box-shadow:0 0 0 6px rgba(201,168,76,.15)}
.ring img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.ring-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:600;color:#C9A84C;background:linear-gradient(135deg,#2E5E45,#1B3A2D)}
.cat-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 13px;border-radius:20px;margin-bottom:8px}
.role-lbl{font-size:13px;font-weight:700;padding:5px 20px;border-radius:22px;margin-bottom:12px;text-align:center;line-height:1.3}
.c-name{color:#fff;font-size:21px;font-weight:700;text-align:center;margin-bottom:4px;line-height:1.2;letter-spacing:-.3px}
.c-prof{color:#8FBFA8;font-size:12.5px;text-align:center;font-weight:400}
.dual-badge{font-size:10px;color:#C9A84C;margin-top:6px;text-align:center;font-weight:600;letter-spacing:.5px}
.nav-bar{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 0 14px;background:#1B3A2D;border-top:1px solid #243d2e;flex-shrink:0}
.arr{background:none;border:1.5px solid #C9A84C;color:#C9A84C;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all .15s;touch-action:manipulation;flex-shrink:0}
.arr:active{background:#C9A84C;color:#1B3A2D;transform:scale(.94)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:220px}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid #3d6b50;background:none;cursor:pointer;transition:all .2s;padding:0;flex-shrink:0}
.dot.on{background:#C9A84C;border-color:#C9A84C;transform:scale(1.3)}
.slide-ct{color:#6B9B80;font-size:10px;min-width:38px;text-align:center;margin-top:3px}
.grid-sec{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#111e16}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.gc{background:#1B3A2D;border:1px solid #243d2e;border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.gc:active{transform:scale(.97);border-color:#C9A84C}
.gc-ph{width:62px;height:62px;border-radius:50%;margin:0 auto 9px;overflow:hidden;border:2px solid #C9A84C;background:#2E5E45}
.gc-ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
.gc-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#C9A84C;font-size:21px;font-weight:700}
.gc-cat{font-size:8px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}
.gc-role{font-size:9px;font-weight:700;border-radius:10px;padding:2px 8px;display:inline-block;margin-bottom:4px;line-height:1.4}
.gc-name{font-size:11.5px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:2px}
.gc-prof{font-size:9.5px;color:#6B9B80}
@media(min-height:720px){.ring{width:184px;height:184px}.c-name{font-size:23px}}
@media(max-height:600px){.ring{width:128px;height:128px;margin-bottom:12px}.c-name{font-size:17px}.c-slide{padding:10px 20px 6px}}
@media(min-width:480px){.shell{border-left:1px solid #2E5E45;border-right:1px solid #2E5E45}}
</style>
</head>
<body>
<div class="shell">
  <div class="ticker-wrap"><div class="ticker-track" id="tkr"></div></div>
  <div class="tabs">
    <button class="tab on" id="tab-all"       onclick="setTab('all')">All</button>
    <button class="tab"    id="tab-exco"      onclick="setTab('exco')">EXCO</button>
    <button class="tab"    id="tab-committee" onclick="setTab('committee')">Committees</button>
    <button class="tab"    id="tab-chiefs"    onclick="setTab('chiefs')">Close Chiefs</button>
    <button class="tab"    id="tab-grid"      onclick="setTab('grid')">Directory</button>
  </div>
  <div class="car-sec" id="car-sec">
    <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
    <div class="c-outer" id="c-outer">
      <div class="c-track" id="ctrack"></div>
    </div>
    <div class="nav-bar">
      <button class="arr" onclick="nav(-1)" aria-label="Previous">&#8592;</button>

        <div class="dots" id="dotrow"></div>
        <span class="slide-ct" id="slidect">1 / 15</span>
      </div>
      <button class="arr" onclick="nav(1)" aria-label="Next">&#8594;</button>
    </div>
  </div>
  <div class="grid-sec" id="grid-sec">
    <div class="grid" id="grid-inner"></div>
  </div>
</div>

function cc(m){return CC[m.cat]||"#4A7C59";}
function isGold(m){return rc(m)==='#C9A84C';}
function isDual(m){return m.name==='Elvis Nwankwo';}

function ringHtml(m){
  const inner=m.photo
    ?`<img src="${m.photo}" alt="${m.name}">`
    :`<div class="ring-fb">${m.initials}</div>`;
  return `<div class="ring">${inner}</div>`;
}
function gcPhHtml(m){
  const inner=m.photo
    ?`<img src="${m.photo}" alt="${m.name}">`
    :`<div class="gc-fb">${m.initials}</div>`;
  return `<div class="gc-ph">${inner}</div>`;
}

function buildSlides(arr){
  const track=document.getElementById('ctrack');
  const dots=document.getElementById('dotrow');
  track.innerHTML='';dots.innerHTML='';
  arr.forEach((m,i)=>{
    const dual=isDual(m)?`<div class="dual-badge">★ Dual Role</div>`:'';
    const s=document.createElement('div');
    s.className='c-slide';
    s.innerHTML=`
      ${ringHtml(m)}
      <span class="cat-lbl" style="background:${cc(m)}28;color:${cc(m)};border:1px solid ${cc(m)}60">${CL[m.cat]||m.cat}</span>
      <span class="role-lbl" style="background:${rc(m)};color:${isGold(m)?'#1B3A2D':'#fff'}">${m.role}</span>
      <div class="c-name">${m.name}</div>
      <div class="c-prof">${m.profession}</div>
      ${dual}`;
    track.appendChild(s);
    const d=document.createElement('button');
    d.className='dot'+(i===0?' on':'');
    d.setAttribute('aria-label','Slide '+(i+1));
    d.onclick=()=>{go(i);resetTimer();};
    dots.appendChild(d);
  });
  go(0);
}

function buildGrid(arr){
  const g=document.getElementById('grid-inner');
  g.innerHTML='';
  // For directory, deduplicate by name — show each person once
  const seen=new Set();
  const unique=arr.filter(m=>{
    if(seen.has(m.name))return false;
    seen.add(m.name);return true;
  });
  unique.forEach(m=>{
    const dual=isDual(m)?`<div style="font-size:8px;color:#C9A84C;font-weight:700;margin-top:2px">★ Dual Role</div>`:'';
    const d=document.createElement('div');
    d.className='gc';
    d.onclick=()=>jumpTo(m);
    d.innerHTML=`
      ${gcPhHtml(m)}
      <div class="gc-cat" style="color:${cc(m)}">${CL[m.cat]||m.cat}</div>
      <div class="gc-role" style="background:${rc(m)};color:${isGold(m)?'#1B3A2D':'#fff'}">${m.role}</div>
      <div class="gc-name">${m.name}</div>
      <div class="gc-prof">${m.profession}</div>
      ${dual}`;
    g.appendChild(d);
  });
}

function go(n){
  cur=Math.max(0,Math.min(n,view.length-1));
  document.getElementById('ctrack').style.transform=`translateX(-${cur*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('slidect').textContent=`${cur+1} / ${view.length}`;
  document.getElementById('prog').style.width=`${((cur+1)/view.length)*100}%`;
}
function nav(d){go((cur+d+view.length)%view.length);resetTimer();}
function resetTimer(){clearInterval(timer);timer=setInterval(()=>nav(1),4200);}

function jumpTo(m){
  view=M.slice();
  setActiveTab('all');showCarousel();
  buildSlides(view);
  setTimeout(()=>{
    const idx=view.findIndex(x=>x.name===m.name&&x.cat===m.cat);
    go(idx>=0?idx:0);resetTimer();
  },50);
}

function setActiveTab(id){
  ['all','exco','committee','chiefs','grid'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el)el.classList.remove('on');
  });
  const el=document.getElementById('tab-'+id);
  if(el)el.classList.add('on');
}
function showCarousel(){
  document.getElementById('car-sec').style.display='flex';
  document.getElementById('grid-sec').style.display='none';
  mode='carousel';
}
function showGrid(){
  document.getElementById('car-sec').style.display='none';
  document.getElementById('grid-sec').style.display='block';
  mode='grid';
}
function setTab(cat){
  if(cat==='grid'){
    view=M.slice();buildGrid(view);showGrid();
    setActiveTab('grid');clearInterval(timer);
  }else{
    view=(cat==='all')?M.slice():M.filter(m=>m.cat===cat);
    buildSlides(view);showCarousel();
    setActiveTab(cat);resetTimer();
  }
}

/* Touch swipe */
const outer=document.getElementById('c-outer');
outer.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY;},{passive:true});
outer.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].screenX-tx;
  const dy=e.changedTouches[0].screenY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>38)nav(dx<0?1:-1);
},{passive:true});

/* Ticker — unique names only */
const seen=new Set();
const unique=M.filter(m=>{if(seen.has(m.name))return false;seen.add(m.name);return true;});
const tkr=document.getElementById('tkr');
tkr.innerHTML=unique.map(m=>`<span class="ticker-item">✦ ${m.name} · ${m.role}</span>`).join('')
  +unique.map(m=>`<span class="ticker-item">✦ ${m.name} · ${m.role}</span>`).join('');

setTab('all');
</script>
