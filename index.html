<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Applewood Estate 2 – EXCO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0d2018;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}

/* ── TICKER ─────────────────────────── */
.ticker-wrap{background:#C9A84C;height:30px;overflow:hidden;display:flex;align-items:center;flex-shrink:0}
.ticker-track{display:flex;white-space:nowrap;animation:tick 40s linear infinite}
.ticker-item{color:#1B3A2D;font-size:12px;font-weight:600;padding:0 32px}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── TABS ────────────────────────────── */
.tabs{display:flex;background:#1B3A2D;border-bottom:1px solid #2E5E45;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:3px solid transparent;color:#6B9B80;font-size:11px;font-weight:600;padding:10px 14px;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.8px;margin-bottom:-1px;flex-shrink:0}
.tab.on{color:#C9A84C;border-bottom-color:#C9A84C}

/* ── LAYOUT SHELL ─────────────────────── */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%}
.carousel-section{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── PROGRESS ────────────────────────── */
.prog-bar{height:3px;background:#2E5E45;flex-shrink:0}
.prog-fill{height:100%;background:#C9A84C;width:0%;transition:width .5s linear}

/* ── CAROUSEL ────────────────────────── */
.c-outer{flex:1;overflow:hidden;position:relative}
.c-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
.c-slide{min-width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px 10px;background:#1B3A2D}

/* ── PHOTO ───────────────────────────── */
.photo-ring{width:160px;height:160px;border-radius:50%;border:3px solid #C9A84C;overflow:hidden;flex-shrink:0;background:#2E5E45;margin-bottom:18px;position:relative}
.photo-ring img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.avatar-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:500;color:#C9A84C;background:linear-gradient(135deg,#2E5E45,#1B3A2D)}

/* ── CARD TEXT ───────────────────────── */
.cat-pill{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:8px}
.role-pill{font-size:13px;font-weight:600;padding:5px 18px;border-radius:22px;margin-bottom:12px}
.c-name{color:#fff;font-size:22px;font-weight:600;text-align:center;margin-bottom:4px;line-height:1.25;letter-spacing:-.2px}
.c-prof{color:#A8C4B0;font-size:13px;text-align:center;font-weight:400}

/* ── NAV ─────────────────────────────── */
.nav-bar{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 0 10px;background:#1B3A2D;border-top:1px solid #2E5E45;flex-shrink:0}
.nav-arr{background:none;border:1.5px solid #C9A84C;color:#C9A84C;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;touch-action:manipulation}
.nav-arr:active{background:#C9A84C;color:#1B3A2D}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #4A7C59;cursor:pointer;transition:all .2s;background:none;padding:0;touch-action:manipulation}
.dot.on{background:#C9A84C;border-color:#C9A84C;transform:scale(1.25)}
.slide-ct{color:#A8C4B0;font-size:11px;min-width:40px;text-align:center}

/* ── GRID VIEW ───────────────────────── */
.grid-outer{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#111e16}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gc{background:#1B3A2D;border:0.5px solid #2E5E45;border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer}
.gc:active{opacity:.8}
.gc-photo{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;overflow:hidden;border:2px solid #C9A84C;background:#2E5E45}
.gc-photo img{width:100%;height:100%;object-fit:cover;object-position:top center}
.gc-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#C9A84C;font-size:22px;font-weight:600}
.gc-cat{font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.gc-role{font-size:9.5px;font-weight:600;color:#1B3A2D;background:#C9A84C;border-radius:10px;padding:2px 8px;display:inline-block;margin-bottom:5px}
.gc-name{font-size:12px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:2px}
.gc-prof{font-size:10px;color:#6B9B80}

/* ── SWIPE HINT FADE ─────────────────── */
@keyframes fadeout{0%{opacity:.7}100%{opacity:0}}
.swipe-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#A8C4B0;font-size:11px;animation:fadeout 2s ease 2s forwards;pointer-events:none}

/* ── RESPONSIVE TWEAKS ───────────────── */
@media(min-height:700px){.photo-ring{width:180px;height:180px}.c-name{font-size:24px}}
@media(max-height:580px){.photo-ring{width:130px;height:130px;margin-bottom:12px}.c-name{font-size:18px}.c-slide{padding:10px 20px 6px}}
</style>
</head>

</div>

const catColor={"exco":"#C9A84C","committee":"#1A6B74","chiefs":"#2E5E45"};
const catLabel={"exco":"Core EXCO","committee":"Committee","chiefs":"Close Chief"};
const roleColors={
  "Chairman":"#C9A84C","Vice Chairman":"#C9A84C",
  "Treasurer":"#4A7C59","General Secretary":"#4A7C59","Financial Secretary":"#4A7C59",
  "Power Committee Chair":"#1A6B74","Security Committee Chair":"#C0622A",
  "Close Chief":"#2E5E45","Deputy Close Chief":"#3B6D52"
};

let cur=0, filt=[], timer, isGrid=false;
let touchStartX=0, touchStartY=0;

function ph(m){
  return m.photo
    ? `<img src="${m.photo}" alt="${m.name}">`
    : `<div class="avatar-fb">${m.initials}</div>`;
}

function buildSlides(arr){
  const track=document.getElementById('ctrack');
  const dots=document.getElementById('dotrow');
  track.innerHTML=''; dots.innerHTML='';
  arr.forEach((m,i)=>{
    const cc=catColor[m.cat]||"#4A7C59";
    const rc=roleColors[m.role]||"#4A7C59";
    const s=document.createElement('div');
    s.className='c-slide';
    s.innerHTML=`
      <div class="photo-ring">${ph(m)}</div>
      <span class="cat-pill" style="background:${cc}25;color:${cc};border:1px solid ${cc}60">${catLabel[m.cat]||m.cat}</span>
      <span class="role-pill" style="background:${rc};color:${rc==='#C9A84C'?'#1B3A2D':'#fff'}">${m.role}</span>
      <div class="c-name">${m.name}</div>
      <div class="c-prof">${m.profession}</div>`;
    track.appendChild(s);
    const d=document.createElement('button');
    d.className='dot'+(i===0?' on':'');
    d.setAttribute('aria-label','Slide '+(i+1));
    d.onclick=()=>{go(i);resetTimer();};
    dots.appendChild(d);
  });
  go(0);
}

function buildGrid(arr){
  const g=document.getElementById('grid-inner');
  g.innerHTML='';
  arr.forEach((m,idx)=>{
    const rc=roleColors[m.role]||"#4A7C59";
    const cc=catColor[m.cat]||"#4A7C59";
    const d=document.createElement('div');
    d.className='gc';
    d.onclick=()=>{ filterCat('all'); setTimeout(()=>{ go(M.indexOf(m)); resetTimer(); },50); };
    d.innerHTML=`
      <div class="gc-photo">${ph(m)}</div>
      <div class="gc-cat" style="color:${cc}">${catLabel[m.cat]||m.cat}</div>
      <div class="gc-role" style="background:${rc};color:${rc==='#C9A84C'?'#1B3A2D':'#fff'}">${m.role}</div>
      <div class="gc-name">${m.name}</div>
      <div class="gc-prof">${m.profession}</div>`;
    g.appendChild(d);
  });
}

function go(n){
  cur=n;
  const arr=filt.length?filt:M;
  document.getElementById('ctrack').style.transform=`translateX(-${cur*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('slidect').textContent=`${cur+1} / ${arr.length}`;
  document.getElementById('prog').style.width=`${((cur+1)/arr.length)*100}%`;
}

function nav(d){
  const arr=filt.length?filt:M;
  go((cur+d+arr.length)%arr.length);
  resetTimer();
}

function resetTimer(){
  clearInterval(timer);
  timer=setInterval(()=>nav(1),4000);
}

function filterCat(cat){
  isGrid=false;
  document.getElementById('carousel-section').style.display='flex';
  document.getElementById('grid-outer').style.display='none';
  ['all','exco','committee','chiefs','grid'].forEach(c=>{
    const el=document.getElementById('tab-'+c);
    if(el) el.classList.remove('on');
  });
  const activeTab=document.getElementById('tab-'+(cat==='all'?'all':cat));
  if(activeTab) activeTab.classList.add('on');
  filt=cat==='all'?[]:M.filter(m=>m.cat===cat);
  buildSlides(filt.length?filt:M);
  buildGrid(filt.length?filt:M);
  resetTimer();
}

function toggleGrid(){
  isGrid=!isGrid;
  clearInterval(timer);
  document.getElementById('grid-outer').style.display=isGrid?'block':'none';
  document.getElementById('carousel-section').style.display=isGrid?'none':'flex';
  document.getElementById('tab-grid').classList.toggle('on',isGrid);
  if(!isGrid){buildSlides(filt.length?filt:M);resetTimer();}
}

/* ── TOUCH SWIPE ─────────────────────── */
const outer=document.getElementById('c-outer');
outer.addEventListener('touchstart',e=>{
  touchStartX=e.changedTouches[0].screenX;
  touchStartY=e.changedTouches[0].screenY;
},{passive:true});
outer.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].screenX-touchStartX;
  const dy=e.changedTouches[0].screenY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
    nav(dx<0?1:-1);
  }
},{passive:true});

/* ── TICKER ──────────────────────────── */
const tkr=document.getElementById('tkr');
tkr.innerHTML=M.map(m=>`<span class="ticker-item">✦ ${m.name} · ${m.role}</span>`).join('')
  + M.map(m=>`<span class="ticker-item">✦ ${m.name} · ${m.role}</span>`).join('');

/* ── INIT ────────────────────────────── */
filterCat('all');
</script>
